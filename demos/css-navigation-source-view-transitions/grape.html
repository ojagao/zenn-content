<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>巨峰 | ひだまりマルシェ</title>
  <!-- ページ遷移の View Transition を有効にする宣言は、外部CSSではなく head に直接書く。
       外部CSSの読み込みが遅いと、遷移先ページで宣言が間に合わずトランジションが打ち切られるため -->
  <style>
    @view-transition {
      navigation: auto;
    }
  </style>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <a class="logo" href="index.html">ひだまりマルシェ</a>
    <nav class="nav"><a href="index.html">商品一覧</a><a href="#">生産者</a><a href="#">よくある質問</a></nav>
    <a class="cart" href="#" aria-label="カート">🛒<span class="cart-count">0</span></a>
  </header>
  <main class="container">
    <nav class="breadcrumb"><a href="index.html">商品一覧</a> / <span>巨峰</span></nav>
    <div class="detail">
      <img class="hero-img" src="https://picsum.photos/id/674/600/600" alt="巨峰">
      <div class="detail-info">
        <p class="producer">ぶどうの丘（山梨）</p>
        <h1 class="detail-name">巨峰</h1>
        <p class="detail-price">¥2,480<span>（税込）/ 1房 約500g</span></p>
        <p class="detail-desc">皮離れがよく、濃厚な甘さが特徴の巨峰。冷やしてそのままどうぞ。</p>
        <label class="qty">数量
          <select><option>1</option><option>2</option><option>3</option></select>
        </label>
        <button class="add-to-cart" type="button">カートに入れる</button>
        <a class="back" href="index.html">← 商品一覧に戻る</a>
        <p class="support" id="support"></p>
      </div>
    </div>
  </main>
  <footer class="site-footer">
    <p>© ひだまりマルシェ（架空のお店です）</p>
    <p class="credit">Photos: Unsplash via Lorem Picsum</p>
  </footer>
  <script src="support.js"></script>
</body>
</html>
